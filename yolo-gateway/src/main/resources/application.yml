# ============================================================
# yolo-gateway 的配置文件
# 作用：告诉 Dubbo 和 Spring，网关该怎么运行
# 注意：这里没有 server.port（HTTP端口），因为网关是纯 Dubbo 服务，
#       不对外提供 HTTP 接口，只用 Dubbo 协议和内部服务通信
# ============================================================

# ---------- Spring Boot 配置 ----------
spring:
  # 应用基本信息
  application:
    name: yolo-gateway       # 这个服务的名字叫 yolo-gateway（注册到 Nacos 用）

# ---------- Dubbo 配置 ----------
dubbo:
  # Dubbo 应用信息
  application:
    name: ${spring.application.name}   # Dubbo 应用名 = Spring 应用名（yolo-gateway）

  # 通信协议配置：网关怎么对外提供服务
  protocol:
    name: tri                  # 用 Triple 协议（Dubbo 的 HTTP/2 + Protobuf 协议）
    port: 9000                 # 网关对外提供 Dubbo 服务的端口（web-api 通过它调用网关）

  # 注册中心配置：网关怎么被找到
  registry:
    address: nacos://127.0.0.1:8848    # 注册到 Nacos（地址 127.0.0.1，端口 8848）
    register-mode: instance             # 以"实例"模式注册（每个实例单独登记）

  # 消费者配置：网关是"调用方"（它调用三个模型服务），这是它调用别人的规矩
  consumer:
    timeout: 30000             # 调用模型服务最多等 30000 毫秒 = 30 秒（推理可能慢）
    retries: 0                 # 不自动重试（避免重复检测浪费算力）
    check: false               # 启动时不检查模型服务是否在（避免模型没起就启动失败）

  # 扫描配置：告诉 Dubbo 去哪个包找注解
  scan:
    base-packages: com.yolo.gateway     # 扫描这个包下的 @DubboService / @DubboReference

# ---------- 项目自定义配置：裁切 ----------
yolo:
  tiling:
    # 大图裁切时，最多同时处理的瓦片数
    # 作用：一张大图切成 30 个瓦片，如果同时处理太多会压垮后端和内存
    #       限制为 8，分批处理，避免内存峰值过高导致 OOM
    max-concurrent-tiles: 8
