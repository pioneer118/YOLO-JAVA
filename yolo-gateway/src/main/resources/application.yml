spring:
  application:
    name: yolo-gateway

dubbo:
  application:
    name: ${spring.application.name}
  protocol:
    name: tri
    port: 9000
  registry:
    address: nacos://127.0.0.1:8848
    register-mode: instance
  consumer:
    timeout: 30000
    retries: 0
    check: false
  scan:
    base-packages: com.yolo.gateway

# ---- 裁切配置 ----
yolo:
  tiling:
    max-concurrent-tiles: 24    # 最大并发 tile 数（1024 模型更慢，提高并发）
